# Composite persistence, kept here so the nested driver parsing stays covered
# even though config.example.yaml no longer ships it as the default.
persistence:
  driver: composite
  composite:
    main:
      driver: solana
      solana:
        rpc: https://api.devnet.solana.com
        program: fx72MZ7SPxwePzFiMagFZakeXxaJn7oLGDd3wxLuENL
        path: # default: $HOME/.flarex/wallet
        account: id.json
    cache:
      driver: badger
      badger:
        name: wallets
        path: # default: $HOME/.flarex/wallet
        # inmem: false
