#       driver: solana
#       solana:
#         rpc: https://api.devnet.solana.com
#         # No wallet program exists yet. This id is the `flarex` NATS/edge
#         # registry, which has no instruction for account records.
#         program: fx72MZ7SPxwePzFiMagFZakeXxaJn7oLGDd3wxLuENL
#         path: # default: $HOME/.flarex/wallet
#         account: id.json
#     cache:
#       driver: badger
#       badger:
#         name: wallets
#         path: # default: $HOME/.flarex/wallet

# Off until an interval is set. The passphrase comes from
# $WALLET_BACKUP_PASSPHRASE, and serve refuses to start without it.
#
# backup:
