persistence:
  driver: badger
  badger:
    name: wallets
    path: # default: $HOME/.flarex/wallet
    # inmem: false

# The solana driver is not implemented yet, so the composite arrangement below
# fails on every write. It is kept as a shape reference, not a usable default.
